version: 1
provider: codex
profile: low

# Lower-usage profile. Use when quota/token consumption matters more than
# maximum reasoning depth. Shared skills still request provider-neutral roles.
roles:
  primary:
    model: gpt-5.6-sol
    effort: medium
    fallbackModels:
      - gpt-6-astra

  executor:
    model: gpt-5.6-sol
    effort: low
    fallbackModels:
      - gpt-6-luna
      - gpt-6-astra

  researcher:
    model: gpt-5.6-sol
    effort: low
    fallbackModels:
      - gpt-6-luna
      - gpt-6-astra

  advisor:
    model: gpt-5.6-sol
    effort: low
    fallbackRoles:
      - executor
      - primary

  fast:
    model: gpt-6-luna
    effort: low
    fallbackRoles:
      - executor
      - primary

behavior:
  advisor:
    repeatedFailureThreshold: 2
    completionCheck: substantial-only
    planCheck: substantial-only

  execution:
    workerScope: bounded
    parallelMode: plan-only
    maxConcurrentAgents: 2

  workClassification:
    defaultSubstantial: false

runtime:
  automaticDetection: true
  defaultProfile: medium
  explicitProviderOverrideEnvironmentVariable: AI_PROVIDER
  explicitProfileOverrideEnvironmentVariable: AI_PROFILE
  repositoryOverridePath: .ai/providers/codex.yml
  repositoryProfileOverridePath: .ai/providers/codex.{profile}.yml
  nativeAgentPrefix: ai-
