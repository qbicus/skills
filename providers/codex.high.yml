version: 1
provider: codex
profile: high

# Quality-first profile. Use when difficult architecture/debugging work justifies
# higher reasoning effort and stronger execution/review models.
roles:
  primary:
    model: gpt-6-astra
    effort: high
    fallbackModels:
      - gpt-6-sol
      - gpt-5.6-sol

  executor:
    model: gpt-6-sol
    effort: high
    fallbackModels:
      - gpt-5.6-sol
      - gpt-6-astra

  researcher:
    model: gpt-6-sol
    effort: high
    fallbackModels:
      - gpt-5.6-sol
      - gpt-6-astra

  advisor:
    model: gpt-6-sol
    effort: high
    fallbackRoles:
      - executor
      - primary

  fast:
    model: gpt-6-luna
    effort: low
    fallbackRoles:
      - executor
      - primary

behavior:
  advisor:
    repeatedFailureThreshold: 2
    completionCheck: substantial-only
    planCheck: substantial-only

  execution:
    workerScope: bounded
    parallelMode: plan-only
    maxConcurrentAgents: 4

  workClassification:
    defaultSubstantial: false

runtime:
  automaticDetection: true
  defaultProfile: medium
  explicitProviderOverrideEnvironmentVariable: AI_PROVIDER
  explicitProfileOverrideEnvironmentVariable: AI_PROFILE
  repositoryOverridePath: .ai/providers/codex.yml
  repositoryProfileOverridePath: .ai/providers/codex.{profile}.yml
  nativeAgentPrefix: ai-
