version: 1
provider: claude
profile: low

# Lower-usage profile. Keeps Sonnet as the main capable model and lowers effort
# and concurrency while retaining Haiku for trivial routing.
roles:
  primary:
    model: sonnet
    effort: medium
    fallbackModels:
      - opus

  executor:
    model: sonnet
    effort: low
    fallbackModels:
      - opus

  researcher:
    model: sonnet
    effort: low
    fallbackModels:
      - opus

  advisor:
    model: sonnet
    effort: low
    fallbackRoles:
      - executor
      - primary

  fast:
    model: haiku
    effort: low
    fallbackRoles:
      - executor
      - primary

behavior:
  advisor:
    repeatedFailureThreshold: 2
    completionCheck: substantial-only
    planCheck: substantial-only

  execution:
    workerScope: bounded
    parallelMode: plan-only
    maxConcurrentAgents: 2

  workClassification:
    defaultSubstantial: false

runtime:
  automaticDetection: true
  defaultProfile: medium
  explicitProviderOverrideEnvironmentVariable: AI_PROVIDER
  explicitProfileOverrideEnvironmentVariable: AI_PROFILE
  repositoryOverridePath: .ai/providers/claude.yml
  repositoryProfileOverridePath: .ai/providers/claude.{profile}.yml
  nativeAgentPrefix: ai-
