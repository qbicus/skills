version: 1
provider: claude
profile: high

# Quality-first profile for difficult work. Opus owns primary decisions and the
# independent advisor; Sonnet runs implementation/research at high effort.
roles:
  primary:
    model: opus
    effort: high
    fallbackModels:
      - sonnet

  executor:
    model: sonnet
    effort: high
    fallbackModels:
      - opus

  researcher:
    model: sonnet
    effort: high
    fallbackModels:
      - opus

  advisor:
    model: opus
    effort: high
    fallbackRoles:
      - executor
      - primary

  fast:
    model: haiku
    effort: low
    fallbackRoles:
      - executor
      - primary

behavior:
  advisor:
    repeatedFailureThreshold: 2
    completionCheck: substantial-only
    planCheck: substantial-only

  execution:
    workerScope: bounded
    parallelMode: plan-only
    maxConcurrentAgents: 4

  workClassification:
    defaultSubstantial: false

runtime:
  automaticDetection: true
  defaultProfile: medium
  explicitProviderOverrideEnvironmentVariable: AI_PROVIDER
  explicitProfileOverrideEnvironmentVariable: AI_PROFILE
  repositoryOverridePath: .ai/providers/claude.yml
  repositoryProfileOverridePath: .ai/providers/claude.{profile}.yml
  nativeAgentPrefix: ai-
